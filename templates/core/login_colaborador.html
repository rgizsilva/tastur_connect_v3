{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login Colaborador — Tastur Connect{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; justify-content: center; align-items: center;">
  <div class="card p-4 p-md-5" style="min-width: 320px; max-width: 420px; width: 100%; border-top: 5px solid var(--primary);">

    <div class="text-center mb-4">
      <div style="font-size:2.4rem">🔐</div>
      <h2 style="color:var(--primary); font-weight:700;">Área do Colaborador</h2>
      <p class="text-muted small">Faça login para acessar o painel</p>
    </div>

    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-grid mt-3">
        <button type="submit" class="btn btn-primary" style="padding:12px;">
          <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
        </button>
      </div>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'core:home' %}" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
    </div>
  </div>
</div>
{% endblock %}
