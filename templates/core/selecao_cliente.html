<!-- core/templates/core/selecao_cliente.html -->

{% extends "base.html" %}

{% block content %}
<div class="container py-4">

    <!-- Cabeçalho -->
    <div class="mb-4">
        <h2 class="section-title">
            Olá, {{ request.session.cliente_nome }} 👋
        </h2>
        <p class="section-subtitle">
            Acesse suas informações e gerencie suas reservas
        </p>
    </div>

    <div class="row g-4">

        <!-- CARD CONSULTAR RESERVAS -->
        <div class="col-md-6">
            <a href="{% url 'core:consultar_reserva_cliente' %}" class="dashboard-card">
                <div class="d-flex align-items-center gap-3">
                    <div class="icon-box bg-primary">
                        <i class="bi bi-calendar-check-fill"></i>
                    </div>
                    <div>
                        <h6 class="mb-1">Consultar Reservas</h6>
                        <small>Visualize e acompanhe suas viagens</small>
                    </div>
                </div>
            </a>
        </div>

        <!-- CARD SAIR -->
        <div class="col-md-6">
            <a href="{% url 'core:logout' %}" class="dashboard-card danger">
                <div class="d-flex align-items-center gap-3">
                    <div class="icon-box bg-danger">
                        <i class="bi bi-box-arrow-right"></i>
                    </div>
                    <div>
                        <h6 class="mb-1">Sair</h6>
                        <small>Encerrar sessão com segurança</small>
                    </div>
                </div>
            </a>
        </div>

    </div>

</div>
{% endblock %}
